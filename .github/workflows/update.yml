name: update chop data

# All crons are UTC. Windows are deliberately an hour wider than the games
# themselves so the same schedule works across the November EDT -> EST shift
# without editing.
#
# These crons only need to START the job — the job then self-loops every 15 min
# while games are live (see the "Build and refresh" step), which is what actually
# holds the cadence, since GitHub drops most scheduled events but never a job
# that's already running. The dense game-window */5 crons just maximise the odds
# that *some* trigger lands soon after a wave kicks off; the every-30-min
# baseline (:07/:37, off the throttled top-of-hour) starts a loop the rest of the
# time and keeps the page fresh off-gameday.
#
# Kickoffs in US Eastern, and where they land in UTC:
#   Thu 20:15 ET (TNF)              -> Fri 00:15-05:00 UTC
#   Sun 09:30 ET (London)           -> Sun 13:30 UTC
#   Sun 13:00 / 16:25 ET            -> Sun 17:00-21:00 UTC
#   Sun 20:20 ET (SNF)              -> Mon 00:20-05:00 UTC
#   Mon 20:15 ET (MNF)              -> Tue 00:15-05:00 UTC
#   Thu holiday slate 12:30 ET      -> Thu 17:00-23:59 UTC
#   Sat late-season slate 13:00 ET  -> Sat 17:00-23:59 UTC, spilling to Sun 00:00-05:00
#
# Even so, treat 15 minutes as a target, not a hard guarantee: there can be a gap
# at the very start of a game wave before the first trigger lands, and the page
# shows its own data age for this reason.

on:
  schedule:
    - cron: '*/5 13-23 * * 0'       # Sunday daytime, London kick through late afternoon
    - cron: '*/5 0-5 * * 1'         # Sunday night football
    - cron: '*/5 0-5 * * 2'         # Monday night football
    - cron: '*/5 0-5 * * 5'         # Thursday night football
    - cron: '*/5 17-23 * * 4'       # Thanksgiving / holiday afternoon games
    - cron: '*/5 17-23 * * 6'       # late-season Saturday slate
    - cron: '*/5 0-5 * * 0'         # spillover from Saturday night games
    - cron: '7,37 * * * *'          # every-30-min baseline (off :00), every day
  workflow_dispatch:                # manual refresh from the Actions tab
  repository_dispatch:              # optional external scheduler, if you add one
    types: [refresh]

# Cancel any run in flight when a new trigger fires: the job self-loops while
# games are live (see below), so a fresh trigger should replace the running loop
# with an immediate rebuild rather than queue behind a multi-hour job.
concurrency:
  group: chop-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Long cap so the self-loop can cover a full game window; the loop itself
    # exits as soon as no NFL games are in progress, so most runs are seconds.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # One trigger, then self-refresh every 15 min WHILE games are live. This
      # sidesteps GitHub's unreliable scheduler: it drops most scheduled events,
      # but a job already running is dependable. Any landed trigger (a game-window
      # */5 tick, the 30-min baseline, a manual dispatch) starts a loop that holds
      # a ~15-min cadence until the slate goes quiet, then exits. Off-gameday the
      # loop does one build and stops, so behaviour there is unchanged.
      - name: Build and refresh while games are live
        env:
          FF_LEAGUE_ID: '350513'
          FF_SEASON: '2026'
        run: |
          set -uo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          INTERVAL=900                              # 15 min between live refreshes
          DEADLINE=$(( $(date +%s) + 330 * 60 ))    # hard stop ~5.5h in

          while : ; do
            if python build_data.py; then
              git add docs/data.json
              if git diff --cached --quiet; then
                echo "no change, nothing to commit"
              else
                week=$(python -c "import json;print(json.load(open('docs/data.json'))['week'])")
                git commit -m "chop data: week ${week} ($(date -u '+%Y-%m-%d %H:%M UTC'))"
                if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                  echo "pushed week ${week}"
                else
                  echo "push failed — will retry next loop"
                fi
              fi
            else
              echo "build failed — will retry next loop"
            fi

            # Keep looping only while NFL games are actually in progress.
            live=$(python -c "import json;print(json.load(open('docs/data.json')).get('players_in_progress',0))" 2>/dev/null || echo 0)
            if [ "${live:-0}" -le 0 ]; then
              echo "no games in progress — done"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "max runtime reached — exiting (a later trigger will resume)"
              break
            fi
            echo "games live (${live} players still playing) — refresh again in ${INTERVAL}s"
            sleep "$INTERVAL"
          done
