name: archive week

# Snapshots the just-finished week's FINAL scores into docs/history/ for the
# history dropdown. Runs Wednesday, long after Monday Night Football has gone
# final, so the week is settled. 12:00 UTC is ~14:00 in Austria during the
# season (CEST); it lands at 13:00 local after the late-October shift to CET.

on:
  schedule:
    - cron: '0 12 * * 3'   # Wednesday ~14:00 Austria
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to archive (blank = auto-detect the finished week)'
        required: false
        default: ''

concurrency:
  group: chop-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Archive week
        env:
          FF_LEAGUE_ID: '350513'
          FF_SEASON: '2026'
          WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -n "${WEEK}" ]; then
            python archive.py --week "${WEEK}"
          else
            python archive.py
          fi

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/history
          if git diff --cached --quiet; then
            echo "no new archive, nothing to commit"
            exit 0
          fi
          git commit -m "archive week scores ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
